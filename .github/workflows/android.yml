name: Android CI

on:
  push:
    branches: [ "master" ] # Triggers whenever you push to master
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # Uses a Linux server provided by GitHub

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Pulls your code onto the server

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      # This project needs Firebase. We recreate the config file from a Secret.
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Artifact
      # This saves the APK so you can download it from GitHub
      uses: actions/upload-artifact@v4
      with:
        name: focus-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
